# Supplementary exploratory task; excluded from core completion-rate reporting.
# The historical task specification needs review before scored reuse.
tasks:
  - task_id: csrankings_us_ai_systems_balanced_school_faculty
    site: csrankings.org
    difficulty: hard
    start_url: https://csrankings.org/#/fromyear/2020/toyear/2025/index?us
    instruction: >
      我想了解 2020-2025 年美国高校里 AI 和 Systems 两类方向都比较均衡的学校，
      以及这类学校中跨方向最广的 faculty。请你基于 CSRankings 查询美国高校在以下
      8 个方向中的单方向排名，并严格按照这个顺序记录结果：
      Artificial Intelligence、Machine Learning、Natural Language Processing、
      Computer Vision、Computer Architecture、Computer Networks、Databases、
      Operating Systems。

      每个方向只记录前 30 名学校；如果某所学校没有进入某个方向前 30 名，
      则把该方向排名记为 31。AI 相关方向是前 4 个方向，Systems 相关方向是后 4 个方向。
      请先筛选出在 8 个方向中至少 6 个方向进入前 30 名，并且 AI 相关方向至少 2 个进入前 30、
      Systems 相关方向至少 2 个进入前 30 的学校。

      对每所候选学校，基于这 8 个方向排名计算：
      1. 排名中位数，即 8 个排名排序后第 4 和第 5 个值的平均数；
      2. 排名平均值；
      3. 最差排名。
      请选择排名中位数最小的学校；如果并列，选择排名平均值更小的学校；如果仍然并列，
      选择最差排名更小的学校；如果还并列，按学校英文名称字母序选择最靠前的学校。

      确定学校后，请继续在 CSRankings 中查看这所学校在上述 8 个方向下的 faculty 列表。
      对每位 faculty，某个方向的 # Pubs 大于 0 就算覆盖该方向。请选择覆盖方向数最多的
      faculty；如果并列，选择 8 个方向 # Pubs 总和最多的人；如果仍然并列，选择姓名字母序
      最靠前的人。

      最终请只输出以下字段，不要输出推理过程：
      学校：
      8 个方向排名：
      排名中位数：
      排名平均值：
      最差排名：
      faculty：
      8 个方向 # Pubs：
      覆盖方向数：
      # Pubs 总和：
    max_steps: 80
    success_criteria:
      type: structured_contains
      expected_answer:
        school: Carnegie Mellon University
        ranks:
          Artificial Intelligence: 1
          Machine Learning: 1
          Natural Language Processing: 1
          Computer Vision: 1
          Computer Architecture: 4
          Computer Networks: 3
          Databases: 6
          Operating Systems: 2
        median_rank: 1.5
        average_rank: 2.375
        worst_rank: 6
        faculty: Zhihao Jia
        faculty_pubs:
          Artificial Intelligence: 1
          Machine Learning: 8
          Natural Language Processing: 2
          Computer Vision: 0
          Computer Architecture: 6
          Computer Networks: 3
          Databases: 2
          Operating Systems: 6
        covered_area_count: 7
        total_pubs: 28
      success_definition: >
        成功答案必须基于 CSRankings 的 2020-2025、USA、8 个单方向排名页面。
        学校筛选时必须只使用每个方向前 30 名，未进入前 30 的方向记为 31。
        最终学校应为 Carnegie Mellon University，其 8 个方向排名按题目顺序为
        1、1、1、1、4、3、6、2；排名中位数为 1.5，平均值为 2.375，最差排名为 6。
        faculty 应为 Zhihao Jia，其 8 个方向 # Pubs 按题目顺序为
        1、8、2、0、6、3、2、6；覆盖方向数为 7，# Pubs 总和为 28。
    forbidden_actions:
      - login
      - payment
      - purchase
      - submit
      - delete
      - remove
      - checkout
      - submit sensitive information
      - bypass captcha
